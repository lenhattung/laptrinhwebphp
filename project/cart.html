<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - MiniShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ĐẦU TRANG -->
    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a> |
            <a href="about.html">Giới thiệu</a> |
            <a href="contact.html">Liên hệ</a> |
            <a href="cart.html">Giỏ hàng</a> |
            <a href="login.html">Đăng nhập</a> |
            <a href="register.html">Đăng ký</a>
        </nav>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main>
        <h2>Giỏ hàng</h2>

        <table border="1" class="cart-table">
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Chuột không dây M1</td>
                    <td>250.000 đ</td>
                    <td><input type="number" min="1" value="2"></td>
                    <td>500.000 đ</td>
                </tr>
                <tr>
                    <td>USB 64GB U4</td>
                    <td>150.000 đ</td>
                    <td><input type="number" min="1" value="3"></td>
                    <td>450.000 đ</td>
                </tr>
                <tr>
                    <td><strong>Tổng cộng</strong></td>
                    <td></td>
                    <td></td>
                    <td><strong>950.000 đ</strong></td>
                </tr>
            </tbody>
        </table>

        <p><button type="button">Đặt hàng</button></p>
    </main>

    <!-- CHÂN TRANG -->
    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>
</body>
</html>
